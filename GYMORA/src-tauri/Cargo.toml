[package]
name = "gymora"
version = "0.1.0"
description = "GYMORA - Sistema de Gestión de Gimnasio"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gymora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Fase 1: Hardware ID y Licencia ---
# Información del sistema (CPU, etc.)
sysinfo = "0.34"
# Obtener MAC Address del adaptador de red
mac_address = "1.1"
# Hash SHA-256 para el fingerprint de hardware y la clave derivada
sha2 = "0.10"
# Convertir bytes de hash a string hexadecimal legible
hex = "0.4"
# Base de datos SQLite local — toda la persistencia del sistema
rusqlite = { version = "0.35", features = ["bundled"] }
# Generación de UUIDs para claves internas
uuid = { version = "1", features = ["v4"] }
# Manejo de fechas para registro de activación
chrono = "0.4"

# --- Fase 6: Dashboard y Exportación PDF ---
# Generación de PDFs para cierre de caja
genpdf = "0.2"
# Diálogo nativo de guardado de archivos (Windows Save As)
tauri-plugin-dialog = "2"
